      - 入门实践全流程笔记: 机器人/ROS2学习笔记/ROS2入门实践全流程笔记.md
      - 核心概念速查表: 机器人/ROS2学习笔记/🧠 ROS2 核心概念速查表（Day 1）.md
      - 为什么 colcon 后要 source: 机器人/ROS2学习笔记/为什么colcon后要source后才能找到包的名字.md
      - 功能包名、节点名与入口名: 机器人/ROS2学习笔记/功能包名、节点名分别是在哪里确认的.md
  - 思想垃圾:
